name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate the published project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src scripts tests app.py
      - run: python -m scripts.release
      - run: python -m pytest -q

  reproduce:
    name: Rebuild the analysis from source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.reproduce
      - run: python -m scripts.verify_reproduction
      - name: Save the executed analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproduced-analysis
          path: |
            notebooks/*.ipynb
            artifacts/figures/story_*.png
            artifacts/tables/selection_replay*.csv
            artifacts/tables/block_sensitivity.csv
            artifacts/tables/*.csv
            artifacts/tables/cv_predictions.csv.gz
            artifacts/checks/*.csv
          retention-days: 7
